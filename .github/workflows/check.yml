name: check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the precache integrity gate diffs against the merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/example/package-lock.json

      - name: Install, type-check SDK public subpaths and build ReactBits example
        run: npm ci && npm run typecheck && npm run build
        working-directory: examples/example

      - name: Build SDK-only consumer demo
        run: npm ci && npm run typecheck && npm run build
        working-directory: examples/sdk-demo

      - name: Static checks and precache integrity gate
        run: node scripts/check.mjs
        env:
          # Pull requests diff against their base; pushes against the previous tip.
          PRECACHE_INTEGRITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Syntax check every script
        run: |
          for file in src/runtime/pwa.js src/runtime/you-ge-sw.js src/runtime/progressier.js src/offline/offline.js src/domain/domain-config.js src/domain/domain-registry.js src/domain/dns-diagnostics.js src/assistant/assistant-state.js src/assistant/assistant-widget.js src/domain/manifest-handler.js functions/manifest.webmanifest.js src/shared/qrcode.js examples/example/example.js examples/example/vite.config.js; do
            node --check "$file"
          done

      - name: Standalone SDK tests and package dry-run
        run: npm test && node scripts/validate-package.mjs && npm pack --dry-run
        working-directory: packages/assistant-sdk

      - name: Unit tests
        run: npm test

      - name: Manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8')); console.log('manifest ok')"
