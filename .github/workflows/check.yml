name: check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the precache integrity gate diffs against the merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Install, type-check SDK public subpaths and build ReactBits example
        run: npm ci && npm run typecheck && npm run build
        working-directory: example

      - name: Static checks and precache integrity gate
        run: node scripts/check.mjs
        env:
          # Pull requests diff against their base; pushes against the previous tip.
          PRECACHE_INTEGRITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Syntax check every script
        run: |
          for file in pwa.js you-ge-sw.js progressier.js offline.js domain-config.js domain-registry.js dns-diagnostics.js assistant-state.js assistant-widget.js manifest-handler.js functions/manifest.webmanifest.js qrcode.js example/example.js example/vite.config.js; do
            node --check "$file"
          done

      - name: Standalone SDK tests and package dry-run
        run: npm test && node scripts/validate-package.mjs && npm pack --dry-run
        working-directory: packages/assistant-sdk

      - name: Unit tests
        run: npm test

      - name: Manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
