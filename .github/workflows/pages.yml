name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/example/package-lock.json

      - name: Build ReactBits example
        run: npm ci && npm run build
        working-directory: examples/example

      - name: Build SDK experience consumer demo
        run: npm ci && npm run typecheck && npm run build
        working-directory: examples/sdk-demo

      - name: Build local Configuration Playground
        run: npm ci && npm run build
        working-directory: examples/config-playground

      - name: Assemble GitHub Pages site
        run: |
          node scripts/assemble-pages.mjs
          find _site -maxdepth 3 -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
